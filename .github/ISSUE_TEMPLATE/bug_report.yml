name: Bug report
description: Something in the RTL, testbench, or build flow isn't behaving as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. If this is a **security-relevant**
        issue (PMP/ePMP bypass, debug-access issue, ECC failure, privilege escalation),
        please don't file it here — see [SECURITY.md](../../SECURITY.md) for how to
        report it privately instead.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: dropdown
    id: config
    attributes:
      label: Configuration
      options:
        - Default
        - SECURE
        - Not sure / not applicable
    validations:
      required: true

  - type: input
    id: build-target
    attributes:
      label: build.sh target
      description: e.g. `./build.sh cosim`, `./build.sh rvfi`, `./build.sh debug`
      placeholder: "./build.sh cosim"

  - type: input
    id: versions
    attributes:
      label: Toolchain versions
      description: Simulator (and version), Python version, GCC version if relevant
      placeholder: "Icarus Verilog 12.0, Python 3.11, riscv64-unknown-elf-gcc 13.2.0"
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands run, input program used, etc.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log / waveform output
      description: Paste console output, or attach a waveform screenshot if useful. This will be formatted as code automatically.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and didn't find a duplicate
          required: true
        - label: I've confirmed this isn't a security issue covered by SECURITY.md
          required: true